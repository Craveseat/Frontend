<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0ED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F1E8E2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="300" fill="url(#bg)" rx="0" ry="0"/>
  <!-- Plate circle -->
  <circle cx="300" cy="125" r="60" fill="none" stroke="#EC5934" stroke-opacity="0.2" stroke-width="3"/>
  <circle cx="300" cy="125" r="50" fill="none" stroke="#EC5934" stroke-opacity="0.12" stroke-width="1.5"/>
  <!-- Fork (left) -->
  <g transform="translate(270, 90)" stroke="#EC5934" stroke-opacity="0.3" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="0" y1="0" x2="0" y2="70"/>
    <line x1="-8" y1="0" x2="-8" y2="25"/>
    <line x1="8" y1="0" x2="8" y2="25"/>
    <line x1="0" y1="0" x2="0" y2="25"/>
  </g>
  <!-- Knife (right) -->
  <g transform="translate(330, 90)" stroke="#EC5934" stroke-opacity="0.3" stroke-width="2.5" fill="none" stroke-linecap="round">
    <line x1="0" y1="25" x2="0" y2="70"/>
    <path d="M0,0 Q10,12 0,25" fill="#EC5934" fill-opacity="0.15" stroke="#EC5934" stroke-opacity="0.3"/>
  </g>
  <!-- Text -->
  <text x="300" y="220" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" fill="#9E9E9E" letter-spacing="2">NO IMAGE</text>
  <!-- Subtle Craveseat branding -->
  <text x="300" y="248" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="10" fill="#EC5934" fill-opacity="0.35" letter-spacing="3">CRAVESEAT</text>
</svg>
